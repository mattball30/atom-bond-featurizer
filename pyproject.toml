[project]
name = "bonafide-chem"
version = "0.2.4"
description = "A Python package for calculating features for atoms and bonds in molecules"
readme = "README.md"
authors = [
    {name = "Lukas M. Sigmund"},
    {name = "Matthew Ball"},
    {name = "Michele Assante"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# psi4 (required), xtb, kallisto, Multiwfn, and ALFABET are not listed here as they are not
# (compatibly) available from PyPI. The pixi environments below provide all of them except
# Multiwfn.
dependencies = [
    "ase<3.27",
    "dbstep>=1.1",
    "dscribe>=2.1",
    "ipywidgets",
    "mendeleev>=1.1,<2",
    "morfeus-ml>=0.8",
    "numpy>=2",
    "pandas>=2",
    "py3Dmol",
    "pydantic>=2",
    "rdkit>=2025.3",
    "scipy",
]

[project.optional-dependencies]
qmdesc = ["qmdesc>=1.0.6", "torch>=2.0", "setuptools<81"]

[project.urls]
Homepage = "https://github.com/MolecularAI/atom-bond-featurizer"
Documentation = "https://molecularai.github.io/atom-bond-featurizer/"
Changelog = "https://github.com/MolecularAI/atom-bond-featurizer/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest", "pytest-mock", "pytest-cov"]
dev = ["mypy", "ruff==0.15.*", "interrogate", "rstfmt", "ipykernel"]
docs = [
    "sphinx",
    "furo",
    "numpydoc",
    "sphinx-copybutton",
    "sphinx-datatables",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-jquery",
    "sphinxcontrib-napoleon",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
bonafide = ["_feature_config.toml", "_feature_info.json", "utils/SMARTS_RX.txt"]

# pixi ############################################################################################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# dscribe 2.1.2 is incompatible with ase 3.27+ (TypeError in dscribe.core.System)
ase = "<3.27"
dbstep = ">=1.1"
dscribe = ">=2.1"
ipywidgets = "*"
mendeleev = ">=1.1,<2"
morfeus-ml = ">=0.8"
numpy = ">=2"
pandas = ">=2"
py3dmol = "*"
pydantic = ">=2"
rdkit = ">=2025.3"
scipy = "*"
# Only available from conda-forge (psi4 is required, dftd3 and xtb are optional)
psi4 = "*"
dftd3-python = "*"
xtb = "6.7.1.*"

[tool.pixi.pypi-dependencies]
bonafide-chem = { path = ".", editable = true }
kallisto = "*"

[tool.pixi.pypi-options]
# kallisto pins numpy<2 but works with numpy 2 (previously installed with "pip install --no-deps")
dependency-overrides = { numpy = ">=2" }

[tool.pixi.activation.env]
BONAFIDE_ALFABET_PYTHON = "$PIXI_PROJECT_ROOT/.pixi/envs/alfabet-env/bin/python"
BONAFIDE_ACIDAMINE_PYTHON = "$PIXI_PROJECT_ROOT/.pixi/envs/acidamine-env/bin/python"

# Installation check (pixi run check_bonafide_installation), built from BONAFIDE's own dependency
# checks.
[tool.pixi.tasks]
_check_packages = { cmd = "python -c 'import bonafide, dbstep, dftd3, dscribe, mendeleev, morfeus, psi4, rdkit; print(\"Python packages: installed.\")'" }
_check_programs = { cmd = "python -c 'from bonafide.utils.dependencies import check_dependency_path as check; [print(f\"{prg}: {check(prg)}\") for prg in (\"xtb\", \"kallisto\", \"Multiwfn_noGUI\")]'" }
_check_alfabet = { cmd = "python -c 'import os; from bonafide.utils.dependencies import check_dependency_env as check; print(f\"alfabet: {check(os.environ[\"BONAFIDE_ALFABET_PYTHON\"], [\"alfabet\"], \"check\")}\")'" }
# qmdesc is skipped in the no-qmdesc environment
_check_qmdesc = { cmd = "python -c 'import os, sys; sys.exit(print(\"qmdesc: skipped (no-qmdesc environment).\")) if os.environ.get(\"PIXI_ENVIRONMENT_NAME\") == \"no-qmdesc\" else None; from bonafide.features.qmdesc_ import get_qmdesc_handler; get_qmdesc_handler().predict(\"CCO\"); print(\"qmdesc: installed.\")'" }
check_bonafide_installation = { cmd = "echo '==> Hurray, all dependencies are installed correctly!'", depends-on = ["_check_packages", "_check_programs", "_check_alfabet", "_check_qmdesc"], description = "Check the installation of BONAFIDE's dependencies" }

# qmdesc is installed by default (default and dev environments); use the no-qmdesc environment to
# leave it out
[tool.pixi.feature.qmdesc.dependencies]
# CPU-only PyTorch for qmdesc (avoids the CUDA wheels from PyPI)
pytorch-cpu = ">=2.0"
# qmdesc imports pkg_resources, which was removed from setuptools 81
setuptools = "<81"

[tool.pixi.feature.qmdesc.pypi-dependencies]
bonafide-chem = { path = ".", editable = true, extras = ["qmdesc"] }

# ALFABET requires Python 3.7 and TensorFlow and therefore lives in a separate environment that
# BONAFIDE calls through a subprocess
[tool.pixi.feature.alfabet.dependencies]
python = "3.7.*"
rdkit = "*"

[tool.pixi.feature.alfabet.pypi-dependencies]
tensorflow = "*"
alfabet = "*"

[tool.pixi.feature.test.tasks]
test = "pytest -s tests/"
coverage = "pytest -s --cov-report=term-missing --cov=bonafide tests/"
test-quick = { cmd = "pytest -s tests/ -m 'not get_fmo_energies_multiwfn and not multiwfn_driver and not attach_electronic_structure_with_multiwfn and not calculate_electronic_structure_with_multiwfn and not miscellaneous'" }

[tool.pixi.feature.dev.tasks]
mypy = "mypy src/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
docstring-coverage = "interrogate -vv src/bonafide -i -I"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "make html", cwd = "docs" }

# Local build of the conda packages in recipe/ (not uploaded anywhere)
[tool.pixi.feature.build.dependencies]
rattler-build = "*"

[tool.pixi.feature.build.tasks]
build-conda = "rattler-build build --recipe-dir recipe --output-dir build/conda -c conda-forge"

[tool.pixi.environments]
default = { features = ["qmdesc"], solve-group = "default" }
dev = { features = ["qmdesc", "test", "dev", "docs"], solve-group = "default" }
no-qmdesc = { solve-group = "default" }
alfabet-env = { features = ["alfabet"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }
acidamine-env = { features = ["acidamine"], no-default-feature = true }

# For the foundation model example: 
[tool.pixi.feature.acidamine.dependencies]
python = "3.10.*"
pytorch = "1.13.*"
pytorch_geometric = "2.4.*"
pytorch_scatter = ">=2.1.1,<3"
pytorch_sparse = ">=0.6.17,<0.7"
pytorch_cluster = ">=1.6.1,<2"
rdkit = "*"
pandas = "*"
numpy = "<2"
tqdm = "*"