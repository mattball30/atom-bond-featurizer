context:
  name: qmdesc
  version: "1.0.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # The sdist of this version does not contain the model file (QM_137k.pt) and there is no
  # corresponding tag on GitHub; therefore, the wheel is used
  url: https://files.pythonhosted.org/packages/py3/q/qmdesc/qmdesc-${{ version }}-py3-none-any.whl
  sha256: f4603b3be54ff82af824847a3b558bb9c252495fd2d41a53acdf78939e9e5fd9
  file_name: qmdesc-${{ version }}-py3-none-any.whl

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install qmdesc-${{ version }}-py3-none-any.whl --no-deps -vv

requirements:
  host:
    - python 3.10.*
    - pip
  run:
    - python >=3.10
    - pytorch >=1.4.0
    - numpy >=1.18.1
    - rdkit
    # qmdesc imports pkg_resources, which was removed from setuptools 81
    - setuptools <81

tests:
  - python:
      imports:
        - qmdesc
      pip_check: true
      python_version: 3.10.*

about:
  homepage: https://github.com/yanfeiguan/qmdesc
  summary: QM descriptor prediction through ChemProp
  license: MIT
